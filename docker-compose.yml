version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: testgen-qdrant
    ports:
      - "6334:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: testgen-ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    container_name: testgen-app
    tty: true                  # Keeps the container shell alive
    stdin_open: true           # Keeps STDIN open for interactive prompts
    volumes:
      - .:/app
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - qdrant
      - ollama

volumes:
  qdrant_storage:
  ollama_data:
